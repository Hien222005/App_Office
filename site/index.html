<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Văn phòng">
<meta name="theme-color" content="#0C111C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>Văn Phòng Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="cau-hinh.js"></script>
<script src="nguon.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">

<style>
:root{
  --f:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  /* JS sẽ đo rồi ghi đè hai biến này. env() ở đây chỉ là mức dự phòng
     cho lần vẽ đầu tiên, vì WebKit lúc cold start hay trả 0. */
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --bg:#0C111C; --bg2:#111726; --panel:#121824; --panel2:#19212F;
  --line:#242E3F; --line2:#36435A;
  --tx:#E9EFF8; --mut:#8A99AE; --dim:#5F6D83;
  --lab:#22E5C4; --el:#7B61FF; --biz:#FF4D6D; --food:#FFB020;
  --ok:#2FE39B; --wait:#FFC24D; --bad:#FF5C72;
  --okbg:#0C2A20; --waitbg:#2E2410; --badbg:#2C1419;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{position:fixed; inset:0; width:100%; height:100%; height:-webkit-fill-available;
  margin:0; overflow:hidden;
  background:var(--bg); color:var(--tx); font-family:var(--f); font-size:16px;
  line-height:1.55; -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; text-align:left}

/* body đã khoá đúng bằng khung nhìn nên ở đây chỉ cần 100% — không dùng
   100vh/100dvh vì iOS lúc cold start hay tính nhầm hai giá trị đó. */
.device{width:100%; max-width:480px; margin:0 auto; height:100%;
  background:var(--bg); display:flex; flex-direction:column; position:relative; overflow:hidden}

.head{flex:0 0 auto; display:flex; align-items:center; gap:10px; z-index:5;
  height:calc(52px + var(--sat));
  padding:var(--sat) 14px 0}
.head .bk{width:38px; height:38px; margin-left:-4px; display:flex; align-items:center;
  justify-content:center; border-radius:50%; color:var(--tx); flex:0 0 auto;
  background:var(--panel); border:1px solid var(--line)}
.head .bk svg{width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:2.3;
  stroke-linecap:round; stroke-linejoin:round}
.head .bk:active{background:var(--panel2)}
.head h1{font-size:19px; font-weight:800; margin:0; flex:1; min-width:0; letter-spacing:-.02em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.head .sub{font-size:12.5px; font-weight:600; color:var(--mut); white-space:nowrap; flex:0 0 auto}

.body{flex:1 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden;
  padding:8px 16px calc(86px + var(--sab));
  display:flex; flex-direction:column; gap:11px;
  scrollbar-width:none; -webkit-overflow-scrolling:touch}
.body::-webkit-scrollbar{display:none}
.body.office{padding:0 0 calc(78px + var(--sab)); gap:0}

/* ══ văn phòng neon ══ */
.scene{width:100%; display:block}
.hint{text-align:center; font-size:13.5px; color:var(--mut); padding:16px 22px 0;
  font-weight:600; line-height:1.5}

/* ══ thành phần ══ */
.stats{display:flex; gap:9px}
.stat1{flex:1; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:11px 12px}
.stat1 .n{font-size:25px; font-weight:900; line-height:1.1; letter-spacing:-.03em}
.stat1 .l{font-size:12px; color:var(--mut); font-weight:600; margin-top:1px}

.tcard{display:grid; grid-template-columns:15px minmax(0,1fr) auto; gap:12px; align-items:start;
  border:1px solid var(--line); border-radius:18px; background:var(--panel); padding:14px; width:100%}
.tcard:active{transform:scale(.99)}
.tcard.gone{opacity:.5}
.stripe{padding-top:3px}
.stripe i{display:block; width:4px; height:100%; min-height:34px; border-radius:3px; background:var(--line)}
.chip{display:inline-block; font-size:12px; font-weight:800; padding:3px 9px; border-radius:8px;
  background:var(--panel2); border:1px solid var(--line); margin-bottom:7px}
.tcard .ti{display:block; font-size:15.5px; font-weight:700; line-height:1.4; letter-spacing:-.01em}
.tcard .crit{font-size:13px; color:var(--mut); margin-top:6px; line-height:1.45; font-weight:500}
.tcard .st{font-size:12px; font-weight:800; padding:4px 9px; border-radius:9px; flex:0 0 auto;
  white-space:nowrap; margin-top:1px}
.st.approved,.st.done{background:var(--okbg); color:var(--ok)}
.st.rejected,.st.blocked{background:var(--badbg); color:var(--bad)}
.st.redo{background:var(--waitbg); color:var(--wait)}
.st.doing{background:var(--panel2); color:var(--mut)}

.qcard{border:1px solid var(--wait); border-radius:18px; padding:15px; background:var(--waitbg)}
.bang{flex:0 0 auto; border:1px solid var(--line); border-radius:16px; background:var(--panel); overflow:hidden}
/* flex:0 0 auto bắt buộc: .body là flex column, item có overflow:hidden sẽ bị co về 0 nếu không khoá. */
.bang .tr{display:grid; grid-template-columns:minmax(0,1fr) 62px 52px 52px 46px; align-items:center;
  padding:9px 12px; width:100%; font-size:14px; font-weight:700; border-top:1px solid var(--line); text-align:left}
.bang .tr:first-child{border-top:none}
.bang .tr.th{font-size:10.5px; font-weight:800; letter-spacing:.03em; text-transform:uppercase;
  color:var(--mut); background:var(--bg2); padding:7px 12px}
.bang .tr.th span:not(:first-child),.bang .tr b,.bang .tr i{text-align:center}
.bang .tr b{font-size:16px; font-weight:900; font-variant-numeric:tabular-nums; text-align:center}
.bang .tr i{color:var(--dim); font-style:normal; text-align:center}
.bang .tr.tong{background:var(--bg2); font-weight:900}
.bang .tr:active{background:var(--panel2)}
.grp{display:flex; align-items:baseline; gap:8px; font-size:12.5px; font-weight:900; letter-spacing:.04em;
  text-transform:uppercase; margin:8px 2px 0}
.grp span{margin-left:auto; font-size:11.5px; font-weight:700; color:var(--mut); text-transform:none; letter-spacing:0}
.tcard .crit .ma{font-family:ui-monospace,Menlo,monospace; font-size:11.5px; color:var(--dim)}
.tl{display:grid; gap:0}
.st-b{display:grid; grid-template-columns:26px minmax(0,1fr); gap:11px; position:relative; padding-bottom:12px}
.st-b:not(:last-child)::before{content:""; position:absolute; left:12px; top:27px; bottom:0; width:2px; background:var(--line)}
.st-b .dot{width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:900; background:var(--panel2); border:2px solid var(--line2); color:var(--mut); z-index:1}
.st-b.xongb .dot{background:var(--okbg); border-color:var(--ok); color:var(--ok)}
.st-b.nay .dot{background:var(--waitbg); border-color:var(--wait); color:var(--wait)}
.st-b.xongb:not(:last-child)::before{background:#2FE39B55}
.st-b .hd{font-size:14.5px; font-weight:800; line-height:26px}
.st-b .hd small{font-size:11.5px; color:var(--mut); font-weight:700; margin-left:5px}
.st-b .bd{display:grid; gap:7px; margin-top:4px}
.st-b.cho .bd{opacity:.45}
/* nút icon lịch trong hàng gõ */
.kh-go .ngay{flex:0 0 auto; border:1px solid var(--line2); background:var(--bg2); color:var(--tx);
  font:inherit; font-size:12px; font-weight:800; border-radius:9px; padding:6px 9px; cursor:pointer;
  display:flex; align-items:center; gap:5px; white-space:nowrap}
.kh-go .ngay svg{width:14px; height:14px; flex:none; fill:none; stroke:currentColor;
  stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round}
.kh-go .ngay.co{border-color:var(--ok); color:var(--ok)}
.kh-go .ngay:active{transform:scale(.95)}

/* tấm lịch trượt lên từ đáy */
.lop{position:absolute; inset:0; z-index:40; background:rgba(4,8,14,.62);
  display:flex; flex-direction:column; justify-content:flex-end; animation:hienlop .18s ease-out}
@keyframes hienlop{from{opacity:0}to{opacity:1}}
.tam{background:var(--panel2); border-top:1px solid var(--line2); border-radius:20px 20px 0 0;
  padding:10px 14px calc(16px + var(--sab)); animation:truotlen .24s cubic-bezier(.2,.9,.3,1)}
@keyframes truotlen{from{transform:translateY(100%)}to{transform:translateY(0)}}
.tam .keo{width:36px; height:4px; border-radius:2px; background:var(--line2); margin:0 auto 12px}
.lich .dau{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px}
.lich .dau b{font-size:15px; font-weight:900}
.lich .dau button{border:0; background:transparent; color:var(--mut); font:inherit; font-size:21px;
  font-weight:700; padding:2px 12px; cursor:pointer; line-height:1; border-radius:8px}
.lich .dau button:active{background:var(--bg2)}
.lich table{width:100%; border-collapse:collapse}
.lich th{font-size:10px; font-weight:800; color:var(--dim); padding-bottom:6px; text-transform:uppercase}
.lich td{text-align:center; padding:1.5px}
.lich .o{width:100%; aspect-ratio:1; border:0; background:transparent; border-radius:10px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  font:inherit; font-size:13px; font-weight:700; color:var(--tx); cursor:pointer; padding:0}
.lich .o.mo{color:var(--dim)}
.lich .o.nay{outline:1.5px solid var(--mut); outline-offset:-1.5px}
.lich .o.chon{background:var(--ok); color:#052015; font-weight:900}
.lich .o i{width:4px; height:4px; border-radius:50%; background:var(--mut)}
.lich .o.chon i{background:#052015}
.lich .o:disabled{opacity:.28; cursor:default}
.kh-go{display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:7px; align-items:center;
  background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:10px 11px; margin:2px 0 10px}
.kh-go input{min-width:0; background:transparent; border:0; color:var(--tx); font:inherit;
  font-size:14.5px; font-weight:600; padding:2px 0; outline:none}
.kh-go input::placeholder{color:var(--dim); font-weight:500}
.kh-go .pick{flex:0 0 auto; border:1px solid var(--line2); background:var(--bg2); color:var(--tx);
  font:inherit; font-size:12px; font-weight:800; border-radius:9px; padding:6px 9px; cursor:pointer}
.kh-go .pick:active{transform:scale(.95)}
.kh-go .gui{width:34px; height:34px; border-radius:11px; border:0; background:var(--ok); color:#052015;
  cursor:pointer; flex:0 0 auto; padding:0; display:grid; place-items:center}
.kh-go .gui svg{width:17px; height:17px; display:block; fill:none; stroke:currentColor;
  stroke-width:2.6; stroke-linecap:round}
.kh-go .gui:disabled{opacity:.35}
.kh-go .gui:active{transform:scale(.94)}
.kh-loc{display:flex; gap:6px; flex-wrap:wrap; margin:0 2px 10px}
.kh-loc button{font:inherit; font-size:12.5px; font-weight:800; padding:6px 13px; border-radius:20px;
  border:1px solid var(--line); background:var(--panel); color:var(--mut); cursor:pointer}
.kh-loc button.on{background:var(--panel2); color:var(--tx); border-color:var(--mut)}
.kh-d{display:grid; grid-template-columns:11px minmax(0,1fr) auto auto auto; gap:9px; align-items:center;
  padding:12px 2px; border-bottom:1px solid var(--line)}
.kh-d:last-child{border-bottom:0}
.kh-d .dot{width:9px; height:9px; border-radius:50%}
.kh-d .ti{font-size:14.5px; font-weight:700; line-height:1.35; letter-spacing:-.01em}
.kh-d .du{display:block; font-size:11.5px; color:var(--mut); font-weight:700; margin-top:2px}
.kh-d.tat .ti{color:var(--mut); text-decoration:line-through}
.kh-d.tat .dot{opacity:.35}
.kh-d .thu{font-size:11px; font-weight:900; padding:3px 7px; border-radius:6px;
  background:var(--bg2); color:var(--mut); flex:0 0 auto}
.kh-d .lap{font-size:10.5px; font-weight:800; padding:3px 7px; border-radius:6px;
  background:var(--okbg); color:var(--ok); flex:0 0 auto}
.kh-d .xoa{border:0; background:transparent; color:var(--mut); font:inherit; font-size:19px;
  font-weight:700; cursor:pointer; padding:4px 7px; line-height:1; border-radius:8px}
.kh-d .xoa:active{background:var(--bg2)}
.kh-d .xoa.hoi{color:var(--bad); font-size:12px; font-weight:900}
.fchip{display:inline-block; font-family:ui-monospace,Menlo,monospace; font-size:11.5px; padding:2px 7px;
  border-radius:6px; background:var(--bg2); border:1px solid var(--line); margin:2px 3px 2px 0; word-break:break-all}
.plink{text-decoration:none; color:inherit; box-sizing:border-box; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center; width:100%;
  border:1px solid var(--info); background:var(--infobg); border-radius:16px; padding:12px 14px}
.plink b{display:block; font-size:14.5px; font-weight:800; color:var(--tx)}
.plink span span{font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--info); word-break:break-all}
.plink .go{color:var(--info); font-weight:900; font-size:19px}
.lb.lbm{color:var(--lab)}
.gon summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px; margin:0}
.gon summary::-webkit-details-marker{display:none}
.gon .dem{font-weight:600; color:var(--mut); font-size:12px}
.gon .mui{margin-left:auto; font-size:18px; line-height:1; transition:transform .15s}
.gon[open] .mui{transform:rotate(90deg)}
.gon[open] .log{margin-top:8px}
@media (prefers-reduced-motion:reduce){.gon .mui{transition:none}}
/* Khung xem sản phẩm ngay trong app — nút Quay lại về đúng màn việc vừa mở */
.xemov{position:fixed; inset:0; z-index:90; display:flex; flex-direction:column; background:var(--bg)}
.xemov .xbar{display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;
  border-bottom:1px solid var(--line); background:var(--panel)}
.xemov .xbar button,.xemov .xbar a{font:inherit; font-weight:800; font-size:15px; border:0; background:none; color:var(--info);
  padding:8px 6px; text-decoration:none; cursor:pointer}
.xemov .xbar .ten{flex:1; min-width:0; font-size:12px; color:var(--mut); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center}
.xemov iframe{flex:1; width:100%; border:0; background:#fff}
.log{font-family:ui-monospace,Menlo,monospace; font-size:12.5px; line-height:1.85; color:var(--mut)}
.log b{color:var(--tx); font-weight:700}
.log .gio{color:var(--lab); font-weight:700}
.fl{font-family:ui-monospace,Menlo,monospace; font-size:12px; line-height:1.8; color:var(--mut);
  word-break:break-all}
.fl .y{color:var(--ok); font-weight:800}
.soat{display:grid; gap:4px; font-size:13.5px; font-weight:700}
.soat div{display:flex; gap:7px} .soat .y{color:var(--ok)} .soat .x{color:var(--wait)}
.fld.okb{border-color:#2FE39B66} .fld.okb .lb{color:var(--ok)}
.st.plan,.st.kq,.st.hoi{background:var(--waitbg); color:var(--wait)}
.st.tre{background:var(--badbg); color:var(--bad)}
.st.lam{background:var(--infobg); color:var(--info)}
.st.xong{background:var(--okbg); color:var(--ok)}
.st.redo{background:var(--badbg); color:var(--bad)}
.qtu{display:flex; gap:7px; margin-top:9px}
.qtu input{flex:1; min-width:0; background:var(--panel); border:1px solid var(--line2); color:var(--tx);
  border-radius:12px; padding:10px 12px; font:inherit; font-size:14px; font-weight:600}
.qtu input::placeholder{color:var(--dim); font-weight:500}
.qtu button{flex:0 0 auto; padding:10px 15px; border-radius:12px; font-size:14px; font-weight:800;
  border:1px solid var(--line2); background:var(--panel2)}
.qcard .qh{font-size:13px; font-weight:800; color:var(--wait); margin-bottom:8px}
.qcard p{font-size:15.5px; margin:0 0 12px; line-height:1.45; font-weight:600}
.qopts{display:flex; flex-wrap:wrap; gap:8px}
.qopts button{font-size:14px; font-weight:700; padding:11px 16px; border-radius:14px;
  border:1px solid var(--line2); background:var(--panel)}
.qopts button:first-child{border-color:var(--ok); color:var(--ok); background:var(--okbg)}
.qopts button:active{transform:scale(.97)}

.btnrow{display:flex; gap:9px}
.btn{flex:1; text-align:center; padding:15px 10px; border-radius:16px; font-size:15.5px;
  font-weight:800; border:1px solid transparent; letter-spacing:-.01em}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--ok); color:#052015}
.btn.gh{border-color:var(--line2); color:var(--tx); background:var(--panel)}
.btn.no{border-color:var(--bad); color:var(--bad); background:var(--panel)}
.btn.sm{flex:0 0 auto; padding:15px 20px}

.fld{border:1px solid var(--line); border-radius:18px; background:var(--panel); padding:13px 15px}
.fld .lb{font-size:12px; font-weight:800; letter-spacing:.03em; text-transform:uppercase;
  color:var(--mut); margin-bottom:7px}
.fld .tx{font-size:15px; line-height:1.55; font-weight:500}
.fld input,.fld textarea{width:100%; background:none; border:none; outline:none; color:var(--tx);
  font:inherit; font-size:15px; font-weight:600; line-height:1.55; resize:none; padding:0}
.fld textarea::placeholder,.fld input::placeholder{color:var(--dim); font-weight:500}
.fld.hi{border-color:var(--ok); border-width:1.5px} .fld.hi .lb{color:var(--ok)}

.rings{display:flex; gap:12px}
.ringbox{flex:1; text-align:center}
.ringbox .cap{font-size:13px; font-weight:700; color:var(--mut); margin-top:4px}
.cam{border:1.5px dashed var(--line2); border-radius:18px; padding:18px 12px; text-align:center;
  background:var(--panel); width:100%}
.cam:active{background:var(--panel2)}
.cam .ic{font-size:25px; line-height:1}
.cam .tx{font-size:13.5px; color:var(--mut); margin-top:8px; font-weight:600}
.meal{display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:12px; align-items:center;
  border:1px solid var(--line); border-radius:16px; padding:10px 12px; background:var(--panel); width:100%}
.meal .th2{width:44px; height:44px; border-radius:14px; background:var(--panel2);
  border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:21px}
.meal .nm{display:block; font-size:15px; font-weight:700}
.meal .sub{font-size:12.5px; color:var(--mut); margin-top:1px; font-weight:600}
.meal .kc{font-size:18px; font-weight:900; color:var(--food)}
.gramrow{display:flex; align-items:center; gap:10px; margin-top:10px}
.gramrow button{width:46px; height:46px; border-radius:16px; border:1px solid var(--line2);
  background:var(--panel2); font-size:22px; font-weight:800; display:flex;
  align-items:center; justify-content:center; flex:0 0 auto}
.gramrow .v{flex:1; text-align:center; font-size:19px; font-weight:800}

.labsec{border-left:3px solid var(--lab); padding-left:14px}
.labsec b{display:block; font-size:14px; font-weight:800; color:var(--lab); margin-bottom:5px}
.labsec p{font-size:14.5px; color:var(--mut); margin:0; line-height:1.65; font-weight:500}
.lock{display:flex; gap:11px; align-items:flex-start; border:1px solid var(--line);
  border-radius:18px; background:var(--panel2); padding:14px}
.lock b{display:block; font-size:14.5px; font-weight:700}
.lock span{font-size:13px; color:var(--mut); line-height:1.5; font-weight:500}

.empty{text-align:center; padding:50px 20px; color:var(--mut)}
.empty .e{font-size:38px; margin-bottom:12px}
.empty p{font-size:14.5px; margin:0; line-height:1.75; font-weight:600}

.toast{position:fixed; left:50%; transform:translateX(-50%); bottom:96px; z-index:60;
  background:#EEF4FB; color:#0B121C; padding:13px 19px; border-radius:16px; font-size:14.5px;
  font-weight:800; box-shadow:0 12px 34px rgba(0,0,0,.5); max-width:86%; text-align:center;
  animation:pop .22s ease}
.toast.warn{background:var(--wait); color:#2A1D02}
@keyframes pop{from{opacity:0; transform:translate(-50%,8px)}}

/* Chạy fn ở khung hình kế tiếp, NHƯNG có lưới an toàn.
   requestAnimationFrame bị treo khi tab chạy nền, khi iOS khoá màn, khi trình duyệt
   tiết kiệm pin. Chỉ dựa vào nó thì có lúc màn hình không bao giờ được vẽ.
   Đo được ngay khi thử: tab nền → go() treo hẳn. Ai tới trước thì chạy, chỉ chạy MỘT lần. */
function khungKeTiep(fn){
  let xong=false;
  const chay=()=>{ if(xong) return; xong=true; fn(); };
  requestAnimationFrame(chay);
  setTimeout(chay, 40);
}

function go(man,opt={}){

  if(opt.loc!==undefined) S.locDe=opt.loc;
  if(opt.task!==undefined) S.taskId=opt.task;
  if(opt.meal!==undefined) S.mealId=opt.meal;

  // Cho viên trượt bay NGAY, rồi mới dựng thân màn ở khung hình sau. Dựng màn Nhà
  // tốn hàng chục mili giây trên điện thoại; làm trước thì nó nuốt mất mấy khung hình
  // đầu của hiệu ứng, và đó chính là cái giật sếp thấy.
  capNhatBar();
  khungKeTiep(()=>{

  });
}

/* Ghi lên Supabase khi đang dùng dữ liệu thật. Lỗi thì trả nhãn về như cũ,
   không để app hiện một đằng database một nẻo. */
async function ghiNhanLenServer(t,nhãn,thêm){
  if(S.nguon!=='that') return true;
  try{ await NG().doiNhan(t.id,nhãn,thêm); return true; }
  catch(e){ toast('Không ghi được lên server: '+e.message,true); return false; }
}

function duyetTask(id,tt,nhan){
  const t=S.tasks.find(x=>x.id===id); if(!t) return;
  if(tt==='tra_lai'){
    // Đã chạm trần thì không đếm thêm: việc đang thuộc bạn.
    if(canBanSua(t)){ toast('Việc này đang chờ bạn sửa, không trả lại được nữa',true); return; }
    t.lan=(t.lan||0)+1;
    // Trả lại luôn về 'da_chot'. Chạm trần là CON SỐ, không phải nhãn riêng:
    // agent tự loại việc có so_lan_lam_lai >= 3, không cần ai đổi nhãn cho nó.
    const cũ=t.tt; t.tt='da_chot';
    ghiNhanLenServer(t,'da_chot',{so_lan_lam_lai:t.lan,phan_hoi_cua_toi:t.phan_hoi||null})
      .then(ok=>{ if(!ok){ t.tt=cũ; t.lan--; render(); } });
    toast(t.lan>=TRAN_LAM_LAI
      ? `Đã trả lại ${t.lan} lần · việc chuyển sang bạn tự sửa`
      : `Trả lại lần ${t.lan}/${TRAN_LAM_LAI} · agent làm lại ở lệnh lam`, t.lan>=TRAN_LAM_LAI);
  } else if(tt==='giao_lai'){
    // Bạn đã tự sửa brief: bộ đếm về 0 thì agent mới nhận lại được việc.
    const cũ=t.tt, lanCũ=t.lan||0; t.tt='da_chot'; t.lan=0;
    ghiNhanLenServer(t,'da_chot',{so_lan_lam_lai:0,phan_hoi_cua_toi:t.phan_hoi||null})
      .then(ok=>{ if(!ok){ t.tt=cũ; t.lan=lanCũ; render(); } });
    toast(nhan);
  } else {
    const cũ=t.tt; t.tt=tt;
    ghiNhanLenServer(t,tt,{phan_hoi_cua_toi:t.phan_hoi||null}).then(ok=>{ if(!ok){ t.tt=cũ; render(); } });
    toast(nhan);
  }
  go('phong');
}

/* Mô phỏng lệnh `lam`: agent làm việc bạn đã chốt, rồi trả về chờ duyệt kết quả. */
function chayLenhLam(){
  if(S.dangChay) return;
  const ds=S.tasks.filter(t=>t.tt==='da_chot');
  if(!ds.length){toast('Chưa có việc nào bạn chốt',true); return;}
  if(S.hoi.tl===null&&ds.some(t=>t.id===S.hoi.task_id)){
    toast('Còn một câu hỏi chờ bạn trả lời',true); go('phong'); return;}
  S.dangChay=true; ds.forEach(t=>t.tt='dang_lam'); go('office');
  toast('Agent bắt đầu làm · lệnh lam');
  let i=0;
  const buoc=()=>{
    if(i>=ds.length){
      S.dangChay=false; render(); toast(`Xong ${ds.length} việc · chờ bạn duyệt kết quả`);
      setTimeout(()=>go('phong'),700); return;}
    const t=ds[i++];
    t.tt='cho_duyet';
    t.link=t.link||`courageous-sprite-17c1ff.netlify.app/xem/e7f3a91c/${t.id}.html`;
    t.ket=t.phan_hoi?'Đã làm theo nhận xét của bạn. Đối chiếu đủ tiêu chí.'
                    :'Đối chiếu đủ tiêu chí xong. Không có chỗ nào phải đoán.';
    t.nk.push(`${new Date().toTimeString().slice(0,5)} · làm xong, chờ bạn duyệt kết quả`);
    render(); setTimeout(buoc,650);
  };
  setTimeout(buoc,800);
}

function ban(x,y,mau,d,nv,i){

      <path d="M-3.4 -.5 L-.4 -2 L.6 -1.5 L-2.4 0 Z" fill="#9AA8BC" opacity=".8"/>
      <path d="M-2.2 .1 L.8 -1.4 L1.8 -.9 L-1.2 .6 Z" fill="#9AA8BC" opacity=".8"/>

}
function san(k,cx,cy){
  const N=NEON[k], W=76, H=38, D=11;
  let g=`<g class="phong" data-p="${k}" style="cursor:pointer">
    <ellipse cx="${cx}" cy="${cy+6}" rx="${W+14}" ry="${H+8}" fill="${N.bong}"
      opacity=".3" filter="url(#nhoe)"/>
    <path d="M${cx-W} ${cy} L${cx} ${cy+H} L${cx} ${cy+H+D} L${cx-W} ${cy+D} Z" fill="${N.toi}"/>
    <path d="M${cx+W} ${cy} L${cx} ${cy+H} L${cx} ${cy+H+D} L${cx+W} ${cy+D} Z" fill="${N.toi}" opacity=".75"/>
    <path d="M${cx} ${cy-H} L${cx+W} ${cy} L${cx} ${cy+H} L${cx-W} ${cy} Z" fill="${N.c}" opacity=".9"/>
    <path d="M${cx} ${cy-H} L${cx+W} ${cy} L${cx} ${cy+H} L${cx-W} ${cy} Z"
      fill="none" stroke="${N.canh}" stroke-width="1.7" opacity=".9" filter="url(#glow)"/>
    <g transform="translate(${cx+34},${cy+2})">${chau(k)}</g>`;
  BAN_VT.forEach((p,i)=>{ g+=ban(cx+p[0],cy+p[1],N.canh,(i*0.31)%1.1,aoPhong(k)[i],i); });
  return g+`</g>`;
}
/* biển tên — vẽ SAU CÙNG nên không bao giờ bị đường nối đè */
function bienTen(k,cx,y){

  return `<g class="phong" data-p="${k}" style="cursor:pointer">

/* huy hiệu trạng thái nổi trên nóc — chỉ "cần duyệt" được phép động mạnh */
function huyHieu(k,cx,y){
  const tt=trangThai(k), P=PING[tt], R=13, so = k==='food' ? 0 : choDuyet(k);
  let tr;
  if(tt==='xong') tr=`<path d="M-5 .4 L-1.4 4 L5.2 -3.2" fill="none" stroke="${P.mau}"

    stroke-linecap="round"/><circle cx="0" cy="4.4" r="1.6" fill="${P.mau}"/>`;
  else tr=[0,1,2].map(n=>`<circle cx="${-4.6+n*4.6}" cy="0" r="1.7" fill="${P.mau}" class="c3"
    style="animation-delay:${(n*.22).toFixed(2)}s"/>`).join('');
  return `<g class="phong ${P.nay?'huy-nay':'huy-troi'}" data-p="${k}"
      style="cursor:pointer;animation-delay:${(cx%5)*.35}s">
    ${P.song?`<circle cx="${cx}" cy="${y}" r="${R}" fill="${P.mau}" opacity=".4" class="song"/>`:''}
    <circle cx="${cx}" cy="${y}" r="${R}" fill="${P.nen}" stroke="${P.vien}" stroke-width="1.6"/>
    <circle cx="${cx}" cy="${y}" r="${R}" fill="none" stroke="${P.mau}" stroke-width="1.1"
      opacity=".85" filter="url(#glow)"/>
    <g transform="translate(${cx},${y})">${tr}</g>
    ${so?`<g transform="translate(${cx+11},${y-10})"><circle r="7.2" fill="${P.mau}"/>
      <text y="3" text-anchor="middle" font-family="Nunito,sans-serif" font-size="9.6"
      font-weight="900" fill="#08131C">${so}</text></g>`:''}
    <path d="M${cx-4} ${y+R+1} L${cx} ${y+R+6} L${cx+4} ${y+R+1} Z" fill="${P.nen}"
      stroke="${P.vien}" stroke-width="1"/></g>`;
}
/* Kiểu 3 · sóng sáng quét. Ba lớp chồng nhau cho vệt có đầu đuôi mềm.
   dasharray 20+200 = 220, chạy đúng -220 = MỘT chu kỳ tròn → vòng lặp khít,
   không bao giờ khựng. Bản cũ dùng 4+7=11 mà chạy -24 nên mỗi vòng lệch 2. */
function luong(VT){
  const t = S.dangChay ? 1.8 : 4.2;
  // Nối đáy sàn này với góc gần nhất của sàn kế tiếp. Màu chuyển từ mảng này sang mảng kia.
  const P=VT.slice(0,-1).map((a,i)=>{
    const b=VT[i+1], x0=a.x, y0=a.y+38, x1=b.x+(b.x>a.x?-76:76), y1=b.y;
    const dx=x1-x0, dy=y1-y0;
    return {id:'l'+(i+1),
      d:`M${x0} ${y0} C ${x0+dx*.34} ${y0+dy*.33}, ${x0+dx*.63} ${y0+dy*.65}, ${x1} ${y1}`,
      c:NEON[a.k].c, c2:NEON[b.k].c};
  });
  return '<g class="luong">' + P.map(p=>`
    <defs><linearGradient id="g${p.id}" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="${p.c}"/><stop offset="100%" stop-color="${p.c2}"/>
    </linearGradient></defs>
    <path d="${p.d}" fill="none" stroke="#0F1727" stroke-width="4.6" stroke-linecap="round"/>
    <path d="${p.d}" fill="none" stroke="url(#g${p.id})" stroke-width="1.5" opacity=".2"/>
    <path d="${p.d}" fill="none" stroke="url(#g${p.id})" stroke-width="4.4" stroke-linecap="round"
      stroke-dasharray="20 200" opacity=".25" class="song-quet" style="--t:${t}s" filter="url(#glow)"/>
    <path d="${p.d}" fill="none" stroke="url(#g${p.id})" stroke-width="2.6" stroke-linecap="round"
      stroke-dasharray="14 206" opacity=".6" class="song-quet" style="--t:${t}s"/>
    <path d="${p.d}" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"
      stroke-dasharray="7 213" class="song-quet" style="--t:${t}s" filter="url(#glow)"/>`).join('')
    + '</g>';
}
/* Bốn mốc đầu giữ đúng tọa độ cũ để bố cục quen mắt không xê dịch. Quá bốn sàn thì
   nối dài xuống, so le trái phải như cũ. Dinh dưỡng luôn đứng cuối. */
const MOC_SAN=[[104,118],[256,236],[104,372],[252,494]];
function sanVT(){
  return [...mangHienThi(),'food'].map((k,i)=>{
    const [x,y]=MOC_SAN[i]||[i%2?254:104, 494+(i-3)*124];
    return {k,x,y};
  });
}
function vanPhong(){
  const VT=sanVT(), cao=Math.max(580, VT[VT.length-1].y+86);
  return `<svg viewBox="0 0 361 ${cao}" class="scene" xmlns:xlink="http://www.w3.org/1999/xlink" role="img"
    aria-label="Bốn phòng ban neon nối nhau bằng luồng sáng. Chạm một phòng để vào.">
    <defs>
      <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
        <feGaussianBlur stdDeviation="3" result="b"/>
        <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <filter id="nhoe" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="13"/>
      </filter>
      <style>
        @keyframes nhay{0%,88%{opacity:1}92%{opacity:.35}96%{opacity:1}}
        @keyframes song{0%{transform:scale(.85);opacity:.55}100%{transform:scale(2.3);opacity:0}}
        @keyframes go{0%,100%{transform:translate(0,0)}50%{transform:translate(.4px,-1.4px)}}
        @keyframes quet{to{stroke-dashoffset:-220}}
        @keyframes troi{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
        @keyframes nay{0%,100%{transform:translateY(0)}28%{transform:translateY(-7px)}
          46%{transform:translateY(0)}60%{transform:translateY(-3px)}74%{transform:translateY(0)}}
        @keyframes cham3{0%,80%,100%{opacity:.28}40%{opacity:1}}
        .mh{animation:nhay 3.4s linear infinite}
        .tay{animation:go .3s ease-in-out infinite}
        .song-quet{animation:quet var(--t,2.4s) linear infinite}
        .song{transform-box:fill-box;transform-origin:center;animation:song 1.9s ease-out infinite}
        .huy-troi{transform-box:fill-box;transform-origin:center;animation:troi 3s ease-in-out infinite}
        .huy-nay{transform-box:fill-box;transform-origin:center;animation:nay 2.2s ease-in-out infinite}
        .c3{animation:cham3 1.35s ease-in-out infinite}
        @media (prefers-reduced-motion:reduce){*{animation:none!important}}
      </style>
    </defs>
    <rect width="361" height="${cao}" fill="none"/>
    ${luong(VT)}
    ${VT.map(o=>san(o.k,o.x,o.y)).join('')}
    ${VT.map(o=>bienTen(o.k,o.x,o.y-50)).join('')}
    ${VT.map(o=>huyHieu(o.k,o.x,o.y-84)).join('')}
  </svg>`;
}

function theTask(t,click){
  const n=NHAN[t.tt]||{ten:t.tt,cls:'lam'};
  const N=NEON[t.mang];
  // Vạch màu theo phòng — nhìn danh sách trộn là biết việc của mảng nào.
  const vach=`<i style="background:${N}"></i>`;
  const meta=[`<span class="ma">${t.id}</span>`,

    t.lan?`<span style="color:var(--wait)">làm lại lần ${t.lan}/${TRAN_LAM_LAI}</span>`:''

        <span><b>Đã ghi vào file gốc · ${daGhiDs.length} việc</b><span style="font-size:12.5px;color:var(--mut)">
        ${daGhiDs.map(t=>t.tieu_de).join(' · ')}</span></span>
        <span style="font-size:19px;color:var(--mut)">›</span></button>`:''}
      ${chotDuoc()?`<div class="btnrow" style="margin-top:auto;padding-top:6px">
        <button class="btn pri" data-chot="1">Chốt ngày · ghi ${choGhi()} việc vào file gốc</button></div>`
        :choSep()?`<div class="fld" style="margin-top:auto"><div class="tx" style="font-size:13.5px;color:var(--mut)">
          Còn ${choSep()} việc chờ bạn. Duyệt hết mới chốt ngày được.</div></div>`:''}`};
}


/* App đang chạy ngoài màn hình chính (standalone) hay trong Safari?
   iOS dùng navigator.standalone; chuẩn chung dùng display-mode. */
function ngoaiManHinh(){
  try{ return window.navigator.standalone===true
    || window.matchMedia('(display-mode: standalone)').matches; }catch{ return false; }
}

function layEmail(){
  const o=document.getElementById('fMail'), v=(o?.value||S.emailGui||'').trim();
  if(!/.+@.+\..+/.test(v)){ o?.focus(); toast('Gõ email chủ nhân vào ô này',true); return null; }
  S.emailGui=v; return v;
}

async function guiMa(){
  const v=layEmail(); if(!v) return;
  const o=document.getElementById('fMa'); if(o) S.maNhap=o.value;
  try{
    await NG().guiLink(v);
    S.dangNhapXong=true; render();
    requestAnimationFrame(()=>document.getElementById('fMa')?.focus());
    toast('Đã gửi mã · mở email lấy 6 số');
  }catch(e){ toast('Không gửi được: '+e.message,true); }
}

/* Chép mã: dùng Clipboard API, có đường lui cho trình duyệt cũ. KHÔNG in mã ra
   console hay gửi đi đâu — nó là chìa khoá vào dữ liệu của sếp. */
async function chepMa(){
  const o=document.getElementById('fMaCho'), v=(o?.value||'').trim();
  if(!v){ toast('Chưa có mã — Safari này chưa đăng nhập',true); return; }
  try{ await navigator.clipboard.writeText(v); toast('Đã chép · mở app rồi dán vào'); }
  catch{
    o.removeAttribute('readonly'); o.focus(); o.select();
    const ok=(()=>{ try{ return document.execCommand('copy'); }catch{ return false; } })();
    o.setAttribute('readonly','');
    toast(ok?'Đã chép · mở app rồi dán vào':'Chạm giữ ô mã rồi chọn Sao chép',!ok);
  }
}

async function xacNhanMa(){
  const o=document.getElementById('fMa'), val=(o?.value||S.maNhap||'').trim();
  if(!val){ o?.focus(); toast('Dán link từ email vào ô này',true); return; }
  // Email chỉ bắt buộc khi dán MÃ SỐ; dán link thì token đã đủ định danh.
  const email=/^\d{4,8}$/.test(val) ? layEmail() : (S.emailGui||'').trim();
  if(/^\d{4,8}$/.test(val) && !email) return;
  try{
    await NG().xacNhanVao(email,val);
    S.maNhap=''; S.dangNhapXong=false;
    toast('Đã vào app');
    go('phieu'); await taiTuNguon();
  }catch(e){ toast(e.message,true); }
}

/* ══════════ HÀNH ĐỘNG · KẾ HOẠCH ══════════
   Ghi thẳng lên Supabase rồi mới vẽ lại. Hỏng thì báo và KHÔNG đổi màn hình — đừng để
   app hiện một đằng database một nẻo. */
function khLuuNhap(){ const o=document.getElementById('khIn'); if(o) S.khNhap=o.value; }

async function khThem(){
  khLuuNhap();
  const ten=S.khNhap.trim();
  if(!ten){ document.getElementById('khIn')?.focus(); toast('Gõ tên việc vào ô này',true); return; }
  const m=S.khMang, cauHinh=(window.CAU_HINH&&window.CAU_HINH.mang)||{};
  if(!m){ toast('Không có mảng nào đang bật',true); return; }
  const skill=cauHinh[m]?.skill;
  if(!skill){ toast('Mảng này chưa gắn Skill nào',true); return; }
  try{
    const ra=await NG().themKeHoach({mang:m, viec:ten, skill,
      ngay:S.khNgay, thu:null, tuan:null, thu_tu:S.kehoach.length});
    S.kehoach=[...S.kehoach,ra].sort(sxKeHoach);
    S.khNhap='';
    render();
    document.getElementById('khIn')?.focus();
    toast(S.khNgay?`Đã thêm · ${ngayDoc(S.khNgay)}`:'Đã thêm · ngày nào cũng lên bảng');
  }catch(e){ toast('Không ghi được: '+e.message,true); }
}

/* Việc không gắn ngày (lặp) đứng trước, rồi tới việc theo ngày, sớm trước muộn sau. */
const sxKeHoach=(a,b)=>
  (a.ngay?1:0)-(b.ngay?1:0) || String(a.ngay||'').localeCompare(String(b.ngay||''))
  || (a.thu??99)-(b.thu??99) || (a.thu_tu??0)-(b.thu_tu??0);

async function khBat(id){
  const k=S.kehoach.find(x=>x.id===id); if(!k) return;
  const moi=!k.bat;
  try{
    await NG().suaKeHoach(id,{bat:moi});
    k.bat=moi; render();
    toast(moi?'Đã bật lại':'Đã tạm ngưng · /report sẽ bỏ qua việc này');
  }catch(e){ toast('Không đổi được: '+e.message,true); }
}

/* Xoá hai nhịp: chạm × lần đầu đổi thành "Xoá?", chạm lần nữa mới xoá thật.
   KHÔNG dùng confirm() — hộp thoại của trình duyệt chặn mọi thứ phía sau nó. */
async function khXoa(id){
  if(S.khXoa!==id){ S.khXoa=id; render(); setTimeout(()=>{ if(S.khXoa===id){S.khXoa=null; render();} },3500); return; }
  try{
    await NG().xoaKeHoach(id);
    S.kehoach=S.kehoach.filter(x=>x.id!==id); S.khXoa=null; render(); toast('Đã xoá');
  }catch(e){ toast('Không xoá được: '+e.message,true); }
}


/* ══════════ LỊCH CHỌN NGÀY ══════════
   Chỉ bật lên khi sếp bấm icon lịch trong hàng gõ — bản B sếp chọn. Danh sách giữ
   trọn màn hình, lịch chỉ xuất hiện đúng lúc cần. */
const THANG_TEN=['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6',
                 'Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
const ngayISO=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const homNay =()=>ngayISO(new Date());
/* Hiện cho người đọc: "T5 24/09", hoặc "Hôm nay" / "Mai" cho hai ngày gần nhất. */
function ngayDoc(iso){
  if(!iso) return 'Mọi ngày';
  const h=homNay(); if(iso===h) return 'Hôm nay';
  const mai=new Date(); mai.setDate(mai.getDate()+1);
  if(iso===ngayISO(mai)) return 'Mai';
  const d=new Date(iso+'T00:00:00');
  return `${['CN','T2','T3','T4','T5','T6','T7'][d.getDay()]} ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`;
}

function veLich(){
  const moc=S.lichThang?new Date(S.lichThang+'-01T00:00:00'):new Date();
  const nam=moc.getFullYear(), thang=moc.getMonth();
  const dau=new Date(nam,thang,1), soNgay=new Date(nam,thang+1,0).getDate();
  const lui=(dau.getDay()+6)%7;                       // Thứ Hai đứng đầu tuần
  const h=homNay();
  // ngày nào đã có việc → chấm nhỏ dưới số
  const coViec=new Set(S.kehoach.filter(k=>k.ngay).map(k=>k.ngay));

  let o=[];
  for(let i=0;i<lui;i++) o.push(null);
  for(let d=1;d<=soNgay;d++) o.push(ngayISO(new Date(nam,thang,d)));
  while(o.length%7) o.push(null);

  const hang=[];
  for(let i=0;i<o.length;i+=7) hang.push(o.slice(i,i+7));

  return `<div class="lich">
    <div class="dau">
      <button data-lichthang="-1" aria-label="Tháng trước">‹</button>
      <b>${THANG_TEN[thang]} · ${nam}</b>
      <button data-lichthang="1" aria-label="Tháng sau">›</button>
    </div>
    <table><tr>${['T2','T3','T4','T5','T6','T7','CN'].map(t=>`<th>${t}</th>`).join('')}</tr>
    ${hang.map(r=>`<tr>${r.map(iso=>{
      if(!iso) return '<td></td>';
      const ngay=+iso.slice(8);
      // Ngày đã qua thì khoá: xếp việc vào quá khứ chỉ tạo ra một dòng không bao giờ
      // tới lượt, mà sếp lại tưởng đã đặt xong.
      const qua = iso < h;
      const cls=[iso===h?'nay':'', iso===S.khNgay?'chon':'', qua?'mo':''].filter(Boolean).join(' ');
      return `<td><button class="o ${cls}" ${qua?'disabled':`data-chonngay="${iso}"`}>${ngay}${
        coViec.has(iso)?'<i></i>':''}</button></td>`;
    }).join('')}</tr>`).join('')}
    </table></div>`;
}

function tamLich(){
  if(!S.lichMo) return '';
  return `<div class="lop"><div class="tam">
    <div class="keo"></div>
    ${veLich()}
    <div class="btnrow" style="margin-top:12px">
      <button class="btn gh" data-chonngay="">Mọi ngày</button>
      <button class="btn pri" data-dongtam="1">${S.khNgay?'Chọn '+ngayDoc(S.khNgay):'Xong'}</button>
    </div></div></div>`;
}

/* ══════════ MÀN KẾ HOẠCH TUẦN ══════════
   Bảng sếp tự ghi; `/report` mỗi sáng đọc nó rồi lập phiếu việc. Bố cục "một dòng một
   việc": ô gõ nằm SẴN trên đầu, không phải mở màn nào khác — vì sếp ghi bằng điện thoại,
   mà gõ trên điện thoại thì chậm, thêm một bước nữa là thêm một lý do để không ghi. */
const TEN_THU={2:'T2',3:'T3',4:'T4',5:'T5',6:'T6',7:'T7',8:'CN'};
const MANG_BAT=()=>MANG.filter(([,v])=>!v.tat).map(([m])=>m);

function manKeHoach(){
  const bat=MANG_BAT();
  if(!S.khMang||!bat.includes(S.khMang)) S.khMang=bat[0]||null;
  const loc=S.khLoc&&bat.includes(S.khLoc)?S.khLoc:null;
  const ds=S.kehoach.filter(k=>!loc||k.mang===loc);

  if(S.nguon!=='that') return {head:`<h1>Kế hoạch</h1>`,
    body:`<div class="empty"><b>Cần đăng nhập</b><p>Kế hoạch tuần lưu trên Supabase.
      Đăng nhập rồi mới ghi được.</p>
      <div class="btnrow"><button class="btn pri" data-dangnhap="1">Đăng nhập</button></div></div>`};

  const dong=k=>{
    const N=NEON[k.mang]||NEON.lab, hoi=S.khXoa===k.id;
    return `<div class="kh-d ${k.bat?'':'tat'}" data-khbat="${k.id}">
      <span class="dot" style="background:${N.c}; box-shadow:0 0 7px ${N.c}"></span>
      <span><span class="ti">${esc(k.viec)}</span>
        <span class="du">${TEN[k.mang]||k.mang}${k.bat?'':' · tạm ngưng'}</span></span>
      <span class="thu">${k.ngay?ngayDoc(k.ngay):(k.thu?TEN_THU[k.thu]:'mọi ngày')}</span>
      ${k.ngay?'':'<span class="lap">lặp</span>'}
      <button class="xoa ${hoi?'hoi':''}" data-khxoa="${k.id}"
        aria-label="Xoá việc này">${hoi?'Xoá?':'×'}</button></div>`;
  };

  return {
    head:`<h1>Kế hoạch</h1><span class="sub">${S.kehoach.length} việc · tuần này</span>
      <button class="kh" data-tailai="1" aria-label="Cập nhật dữ liệu" title="Cập nhật">${sv('taiLai')}</button>`,
    body:`
      <div class="kh-go">
        <button class="pick" data-khmang="1" style="color:${(NEON[S.khMang]||NEON.lab).c}"
          >${S.khMang?TEN[S.khMang]:'—'}</button>
        <input id="khIn" placeholder="Việc mới…" value="${esc(S.khNhap)}" autocomplete="off">
        <button class="ngay ${S.khNgay?'co':''}" data-molich="1" aria-label="Chọn ngày">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3.2"/>
            <path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/></svg>${ngayDoc(S.khNgay)}</button>
        <button class="gui" aria-label="Thêm việc" data-khthem="1">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      </div>

      ${bat.length>1?`<div class="kh-loc">
        <button class="${loc?'':'on'}" data-khloc="">Tất cả</button>
        ${bat.map(m=>`<button class="${loc===m?'on':''}" data-khloc="${m}">${TEN[m]}</button>`).join('')}
      </div>`:''}

      ${tamLich()}
      ${ds.length?ds.map(dong).join('')
        :`<div class="empty"><b>Chưa có việc nào</b>
          <p>Gõ vào ô trên rồi bấm <b>+</b>. Chạm nút thứ để chọn ngày — để <b>mọi ngày</b>
          thì hôm nào cũng lên bảng.</p></div>`}
`};
}

/* Xem sản phẩm trong app. Trên app ở màn hình chính, link mở ra ngoài là rời app hẳn,
   muốn quay lại phải vuốt đổi app. Khung này đè lên màn việc; Quay lại là đóng nó. */
function moXem(url){
  dongXem();
  const d=document.createElement('div'); d.className='xemov'; d.id='xemOv';
  d.innerHTML=`<div class="xbar"><button type="button" data-dongxem>‹ Quay lại</button>
    <span class="ten">${esc(url.replace(/^https?:\/\//,''))}</span>
    <a href="${esc(url)}" target="_blank" rel="noopener" aria-label="Mở bằng trình duyệt">↗</a></div>
    <iframe src="${esc(url)}" title="Sản phẩm"></iframe>`;
  document.body.appendChild(d);
}
function dongXem(){ document.getElementById('xemOv')?.remove(); }

/* Màn chi tiết một việc = dòng thời gian bốn bước, đúng bản đã chốt:
   ① kế hoạch → ② làm trong bản nháp → ③ kết quả → ④ bạn duyệt. */
function manTask(){
  const t=S.tasks.find(x=>x.id===S.taskId); if(!t) return manPhong();
  const n=NHAN[t.tt]||{ten:t.tt,cls:'lam'};
  const b=t.brief||{};
  const daChot=t.tt!=='cho_chot';
  const daLam=['cho_duyet','da_duyet','da_ghi'].includes(t.tt)||daLamLai(t);
  const coKQ=['cho_duyet','da_duyet','da_ghi'].includes(t.tt);
  const daDuyet=['da_duyet','da_ghi'].includes(t.tt);
  const chip=(ds)=>(ds||[]).map(x=>`<span class="fchip">${x}</span>`).join('')||'<span class="fchip">chưa khai</span>';
  const buoc=(cls,so,hd,sm,bd)=>`<div class="st-b ${cls}"><div class="dot">${cls==='xongb'?'✓':so}</div>
    <div><div class="hd">${hd}${sm?`<small>${sm}</small>`:''}</div><div class="bd">${bd||''}</div></div></div>`;

  // Phạm vi lấy từ Skill của phòng (tao-cau-hinh.mjs gửi sang), brief không phải khai lại.
  const suaSkill=((window.CAU_HINH&&window.CAU_HINH.mang)||{})[t.mang]?.sua;
  const b1=`<div class="fld"><div class="lb">Agent định làm · hạn ${t.han}</div><div class="tx">${b.nhiem_vu||t.chi_tiet||'—'}</div></div>
    <div class="fld"><div class="lb">Chỉ được đụng vào</div><div class="tx">${chip(b.file_duoc_sua?.length?b.file_duoc_sua:suaSkill)}</div></div>
    ${b.viec_khong_lam?.length?`<div class="fld"><div class="lb">Việc không được làm</div>
      <div class="tx" style="font-size:13px">${b.viec_khong_lam.map(x=>'· '+x).join('<br>')}</div></div>`:''}
    ${t.tt==='cho_chot'?`<div class="btnrow"><button class="btn pri" data-act="da_chot">Chốt việc này</button>
      <button class="btn no" data-act="bo">Bỏ</button></div>`:''}`;

  // Nhật ký do hook ghi, agent không viết — nên không quên được.
  // Thu gọn mặc định: nhật ký dài, sếp ít khi cần đọc. Bấm mũi tên để mở.
  const b2=daLam?`<details class="fld gon"><summary class="lb lbm">Agent đã làm gì
      <span class="dem">${(t.nk||[]).length} bước</span><span class="mui">›</span></summary>
      <div class="log">${(t.nk&&t.nk.length)
        ? t.nk.map(x=>{const m=String(x).match(/^(\d{1,2}:\d{2}(?::\d{2})?)\s*·\s*(\S+)\s*·\s*(.*)$/);
            return m ? `<span class="gio">${m[1]}</span> ${m[2].toLowerCase()} <b>${m[3]}</b>`
                     : `<span class="gio">·</span> ${x}`;}).join('<br>')
        : 'nhật ký chưa ghi bước nào'}</div></details>`:'';

  // File máy tự lấy bằng cách so bản nháp với bản gốc — không có lời khai nào để man.
  const bFile=(coKQ&&t.files?.length)?`<div class="fld"><div class="lb lbm">${t.files.length} file đã đụng
      <span style="color:var(--ok);font-weight:700">· khớp bản nháp, không lấn</span></div>
      <div class="fl">${t.files.map(f=>`<span class="y">✓</span> ${f}`).join('<br>')}</div></div>`:'';

  // Bấm là mở sản phẩm ngay trong app, có nút quay lại (moXem). href giữ làm dự phòng.
  // Chỉ nhận http(s) — link lạ thì hiện chữ, không bấm được.
  const hrefSP=/^https?:\/\//i.test(t.link||'')?t.link:(t.link&&!/^[a-z]+:/i.test(t.link)?'https://'+t.link:'');
  const b3=coKQ?`${t.link?(hrefSP?`<a class="plink" href="${esc(hrefSP)}" target="_blank" rel="noopener" data-xem="${esc(hrefSP)}">
      <span><b>Mở sản phẩm</b><span>${esc(t.link)}</span></span><span class="go">›</span></a>`
      :`<div class="plink"><span><b>Link sản phẩm</b><span>${esc(t.link)}</span></span></div>`):''}
    <div class="fld"><div class="lb lbm">Kỳ vọng kết quả</div><div class="tx">${t.ket||'—'}</div></div>`:'';

  const b4=
    t.tt==='cho_duyet' ? `<div class="fld hi"><div class="lb">◆ Nhận xét nếu trả lại</div>
        <textarea id="fNote" rows="3" placeholder="Sai ở đâu, muốn thế nào… agent đọc khi làm lại">${t.phan_hoi}</textarea></div>`
  : t.tt==='da_ghi' ? `<div class="fld okb"><div class="tx">Đã chép từ bản nháp về file gốc, kiểm mã băm đạt.</div></div>`
  : t.tt==='da_duyet' ? `<div class="fld okb"><div class="tx">Bạn đã duyệt. Chờ chốt ngày để ghi cả loạt vào file gốc.</div></div>`
  : canBanSua(t) ? `<div class="fld" style="border-color:var(--bad)"><div class="lb" style="color:var(--bad)">Đã trả lại ${t.lan} lần</div>
        <div class="tx" style="font-size:13.5px">Agent không chạm vào việc này nữa. Sửa tên việc hoặc nhận xét bên trên rồi giao lại.</div></div>
      <div class="fld hi"><div class="lb">◆ Nhận xét của bạn</div>
        <textarea id="fNote" rows="3">${t.phan_hoi}</textarea></div>`
  : '';

  const nut=
    t.tt==='cho_duyet' ? `<div class="btnrow" style="margin-top:auto;padding-top:4px">
        <button class="btn pri" data-act="da_duyet">Duyệt kết quả</button></div>
      <div class="btnrow"><button class="btn no" data-act="tra_lai">Yêu cầu làm lại · lần ${(t.lan||0)+1}/${TRAN_LAM_LAI}</button></div>`
  : canBanSua(t) ? `<div class="btnrow" style="margin-top:auto"><button class="btn pri" data-act="giao_lai">Giao lại cho agent</button>

// Cả hai chiều đều dùng Web Speech API của trình duyệt — miễn phí, không qua Gemini.
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const VOICE = { co: !!SR, may: null };

function batNghe(){
  if(!VOICE.co || S.nghe) return;
  dungDoc();
  const r = new SR();
  r.lang = 'vi-VN'; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
  let chot = '';
  r.onresult = e => {
    let tam = '';
    for(let i = e.resultIndex; i < e.results.length; i++){
      const p = e.results[i][0].transcript;
      if(e.results[i].isFinal) chot += p; else tam += p;
    }
    const o = document.getElementById('cIn');
    if(o) o.value = (chot + tam).trim();
  };
  r.onerror = e => {
    S.nghe = false; VOICE.may = null; render();
    if(e.error === 'not-allowed')
      toast('Chưa cho phép dùng micro. Bật trong cài đặt trình duyệt.', true);
    else if(e.error !== 'aborted' && e.error !== 'no-speech')
      toast('Không nghe được: ' + e.error, true);
  };
  r.onend = () => {
    S.nghe = false; VOICE.may = null;
    const t = chot.trim();
    if(t){ S.chatNhap = t; render(); guiChat(t); } else render();
  };
  VOICE.may = r; S.nghe = true; render();
  try{ r.start(); }catch{ S.nghe = false; VOICE.may = null; render(); }
}
function tatNghe(){ if(VOICE.may){ try{ VOICE.may.stop(); }catch{} } }

function docTo(t){
  if(!S.doc || !window.speechSynthesis) return;
  dungDoc();
  const u = new SpeechSynthesisUtterance(t.slice(0, 900));
  u.lang = 'vi-VN'; u.rate = 1.05;
  const v = speechSynthesis.getVoices().find(x => x.lang && x.lang.startsWith('vi'));
  if(v) u.voice = v;
  speechSynthesis.speak(u);
}
function dungDoc(){ if(window.speechSynthesis) try{ speechSynthesis.cancel(); }catch{} }

// gói trạng thái hiện tại thành bối cảnh — Gemini không tự biết gì về app
/* Vẽ chữ trợ lý trả về. Nó viết **đậm** và gạch đầu dòng; app trước nay hiện chữ thô
   nên sếp thấy cả dấu sao. RÀO TRƯỚC rồi mới đổi — thứ tự đó là chỗ an toàn nằm ở:
   mọi dấu < > & của trợ lý đã thành chữ thường trước khi ta chèn thẻ nào vào.
   Chỉ nhận ĐÚNG hai thứ: **đậm** và dòng mở đầu bằng "- ". Không nhận gì khác. */
function veChuChat(tho){
  const rao = String(tho ?? '').replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  return rao.split('\n').map(d=>{
    const dam = t => t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
                      .replace(/\*/g, '');          // dấu sao lẻ còn sót thì bỏ luôn
    const m = d.match(/^(\s*)-\s+(.*)$/);
    if(!m) return `<span class="d">${dam(d)}</span>`;
    const sau = m[1].length >= 2 ? ' sau' : '';       // gạch đầu dòng cấp hai thụt vào
    return `<span class="ch${sau}">${dam(m[2])}</span>`;
  }).join('');
}

function boiCanh(){
  // Mỗi việc gửi kèm CỜ, để Thư ký chọn đúng cụm tình trạng trong mẫu báo cáo
  // thay vì tự suy từ tên nhãn.
  const soNgayTre = t => {
    if(!t.tre || !t.hanISO) return null;
    return Math.max(1, Math.floor((Date.now()-new Date(t.hanISO))/864e5));
  };
  const v = t => ({mang:TEN[t.mang]||t.mang, tieu_de:t.tieu_de, trang_thai:t.tt,
    tre_han_ngay: soNgayTre(t),
    dang_hoi: dangVuong(t),
    da_tra_lai_3_lan: canBanSua(t),
    ky_vong_ket_qua:t.ket||null,
    dan_do_cua_sep:t.phan_hoi||null});
  return {
    ngay: new Date().toLocaleDateString('vi-VN'),
    // Thứ tự và danh sách mảng cho mẫu báo cáo: mảng không có việc vẫn phải hiện "· trống".
    cac_mang_dang_bat: MANG.filter(([,x])=>!x.tat).map(([,x])=>x.ten),
    // Trợ lý không tự đếm được nếu không đưa số. Đếm sẵn ở đây, một nguồn duy nhất.
    dang_cho_sep: {
      tong: choSep(),
      cho_chot: S.tasks.filter(t=>t.tt==='cho_chot').length,
      cho_duyet_ket_qua: S.tasks.filter(t=>t.tt==='cho_duyet').length,
      da_tra_lai_3_lan: S.tasks.filter(t=>canBanSua(t)).length,
      tre_han: S.tasks.filter(t=>t.tre).length,
      // "Kẹt" = việc đứng im chờ sếp gỡ: agent đang hỏi, hoặc đã trả lại 3 lần.
      dang_ket: S.tasks.filter(t=>VIEC_SONG(t)&&(dangVuong(t)||canBanSua(t))).length,
    },
    // CHỈ gửi việc còn sống. Trước đây gửi tất, nên trợ lý báo cáo cả việc "Bỏ" như
    // việc hôm nay — sếp thấy ngay trong ảnh chụp 22/09.
    viec: S.tasks.filter(t=>!['bo','da_ghi'].includes(t.tt)).map(v),
    da_xong_hoac_bo: S.tasks.filter(t=>['bo','da_ghi'].includes(t.tt)).length,
    ke_hoach: S.kehoach.map(k=>({mang:TEN[k.mang]||k.mang, viec:k.viec,
      ngay:k.ngay||null, lap_moi_tuan:!k.ngay, dang_bat:k.bat})),
    cau_hoi_agent: S.hoi.tl ? null : {hoi:S.hoi.cau_hoi, phuong_an:S.hoi.pa},
    dinh_duong: {
      da_an_kcal: tongKcal(), muc_tieu_kcal: S.mt.kcal,
      da_an_protein: tongPro(), muc_tieu_protein: S.mt.pro,
      cac_bua: S.meals.map(m=>({ten:m.ten, gram:m.gram, gio:m.gio, kcal:kcalOf(m)}))
    }
  };
}

async function guiChat(noiDung){
  const t = (noiDung ?? S.chatNhap).trim();
  if(!t || S.chatBan) return;
  S.chatTin.push({ai:'toi', noi:t}); S.chatNhap=''; S.chatBan=true; render();
  try{
    const r = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        lich_su: S.chatTin.filter(m=>m.ai!=='loi').slice(-10),
        boi_canh: boiCanh()
      })
    });
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.loi || ('Máy chủ trả lỗi ' + r.status));
    const tl = d.tra_loi || '(không có nội dung trả về)';
    S.chatTin.push({ai:'bot', noi: tl}); docTo(tl);
  }catch(e){
    S.chatTin.push({ai:'loi', noi:'Không gọi được trợ lý: ' + e.message +
      '\n\nKiểm tra biến GEMINI_API_KEY đã đặt trên Netlify chưa.'});
  }
  S.chatBan=false; render();
  requestAnimationFrame(()=>{const b=document.querySelector('.tin'); if(b) b.scrollTop=b.scrollHeight;});
}

async function taiTuNguon(){
  const n=NG(); if(!n) return;
  S.dangTai=true; render();
  try{
    const d=await n.tai();
    S.nguon=n.cheDo;
    if(d){ S.tasks=d.viec; if(d.hoi) S.hoi=d.hoi; }
    // Kế hoạch tải riêng: hỏng bảng này thì việc vẫn phải hiện, đừng để một bảng
    // kéo sập cả màn hình.
    if(n.cheDo==='that'){
      try{ S.kehoach=await n.taiKeHoach(); }
      catch(e){ toast('Không tải được kế hoạch: '+e.message,true); }
    }
  }catch(e){ toast('Không tải được dữ liệu: '+e.message,true); }
  S.dangTai=false; render();
}

/* Vẽ lại màn hình NHƯNG KHÔNG ĐỤNG THANH DƯỚI.
   Trước đây render() ghi đè cả dev.innerHTML, nên mỗi lần đổi tab là thanh dưới bị đập
   đi xây lại — đúng lúc nó đang chạy hiệu ứng. Màn Nhà nặng 41,8 KB với 396 thẻ SVG
   (đo 21/09), trình duyệt bận dựng đống đó nên viên trượt khựng. Ba màn kia nhẹ nên
   không thấy. Nay thanh dưới là một thẻ SỐNG SUỐT ĐỜI, chỉ đổi class. */
function render(){
  const dev=document.getElementById('dev');
  if(!dev.querySelector(':scope > .bar')){
    dev.innerHTML=`<div class="head"></div><div class="body"></div>${thanhDuoi()}<div class="phu"></div>`;
  }
  const m=manHienTai();
  dev.querySelector(':scope > .head').innerHTML=
    `${m.back?`<button class="bk" data-go="${m.back}">${sv('back')}</button>`:''}${m.head}
     <button class="kh ${S.chinhBar?'mo':''}" data-bar="${S.chinhBar?'khoa':'mo'}"
       aria-label="${S.chinhBar?'Khoá vị trí thanh dưới':'Chỉnh vị trí thanh dưới'}"
       >${sv(S.chinhBar?'mokhoa':'khoa')}</button>`;
  const than=dev.querySelector(':scope > .body');
  than.className='body'+(m.office?' office':'');
  than.innerHTML=m.body;
  dev.querySelector(':scope > .phu').innerHTML=bangChinh()+cuaSoChat();
  capNhatBar();
}

/* Chỉ đổi class và số trên thanh dưới. Không dựng lại thẻ nào. */
function capNhatBar(){
  const nav=document.querySelector('.tabs'); if(!nav) return;
  const bar=nav.closest('.bar');
  if(bar) bar.className=`bar bar-${S.kieu} ${S.chinhBar?'chinh':''}`;

  let cur=S.man;
  if(cur==='task'||cur==='lab') cur='phong';
  const i=Math.max(0,TAB.indexOf(cur));
  const tabs=[...nav.querySelectorAll('.tab')];

  // Đổi class trong lúc transition đang tắt, để đo được kích thước ĐÍCH.
  nav.classList.add('do-luong');
  tabs.forEach((t,k)=>t.classList.toggle('on',k===i));
  nav.dataset.i=i; nav.style.setProperty('--i',i);

  // huy hiệu số việc chờ sếp trên tab Việc
  const cd=choSep(), tabViec=tabs[TAB.indexOf('phong')];
  if(tabViec){
    let n=tabViec.querySelector('.noti');
    if(cd&&!n){ n=document.createElement('i'); n.className='noti'; tabViec.appendChild(n); }
    if(n){ if(cd) n.textContent=cd; else n.remove(); }
  }

  const on=tabs[i], gl=nav.querySelector('.glider');
  if(!on||!gl){ nav.classList.remove('do-luong'); return; }
  const w=on.offsetWidth, x=on.offsetLeft;      // ép tính lại, transition đang tắt
  nav.classList.remove('do-luong');

  const doiTab = glidePrev && glidePrev.i!==i;
  if(doiTab){
    gl.style.transition='none';
    gl.style.width=glidePrev.w+'px'; gl.style.transform=`translateX(${glidePrev.x}px)`;
    void gl.offsetWidth;                         // ép vẽ mốc cũ trước khi bay
    gl.style.transition='';
    khungKeTiep(()=>{ gl.style.width=w+'px'; gl.style.transform=`translateX(${x}px)`; });
  }else{
    gl.style.transition='none';
    gl.style.width=w+'px'; gl.style.transform=`translateX(${x}px)`;
    void gl.offsetWidth;
    gl.style.transition='';
  }
  glidePrev={i,w,x};
}

/* ══════════ NGƯỜI DÙNG TỰ CHỈNH VỊ TRÍ THANH DƯỚI ══════════
   Ghi đè thẳng vào --sab: cả bar, chỗ chừa nội dung và ô nhập chat đều bám
   biến này, nên một con số là khớp hết. Lưu localStorage để lần sau còn nguyên. */
const KHOA_LS = 'vp_bar_sab';
function tayChinh(){
  try{ const v = localStorage.getItem(KHOA_LS); return v === null ? null : parseInt(v,10); }
  catch{ return null; }
}
function apTayChinh(px){
  document.documentElement.style.setProperty('--sab', px + 'px');
  try{ localStorage.setItem(KHOA_LS, String(px)); }catch{}
  sabCu = px;
}
function boTayChinh(){
  try{ localStorage.removeItem(KHOA_LS); }catch{}
  sabCu = -1; doVungAnToan();
}
function sabHienTai(){
  const v = tayChinh();
  if(v !== null) return v;
  return Math.round(parseFloat(getComputedStyle(document.documentElement)
    .getPropertyValue('--sab')) || 0);
}

function bangChinh(){
  if(!S.chinhBar) return '';
  const v = sabHienTai();
  return `<div class="panel-ch" id="pCh">
    <div class="ph"><b>Vị trí thanh dưới</b><i id="pVal">${v}px</i></div>
    <div class="mo-ta">Kéo cho thanh nằm vừa trên vạch home của máy bạn.
      Giá trị được lưu lại, lần sau mở app vẫn giữ nguyên.</div>
    <input type="range" id="pRange" min="0" max="80" step="1" value="${v}">
    <div class="nut">
      <button data-bar="auto">Tự động</button>
      <button class="chot" data-bar="khoa">Khoá lại</button>
    </div></div>`;
}

/* ══════════ VÙNG AN TOÀN iOS ══════════
   WebKit lúc cold start thường trả env(safe-area-inset-*) = 0, rồi mới tính đúng
   sau vài trăm mili giây — đó là lý do "mở lần đầu lệch, thoát ra vào lại mới đúng".
   Cách chắc chắn: dựng một thẻ dò, ĐO bằng JS sau khi layout xong, ghi vào biến CSS.
   Rồi đo lại ở mọi thời điểm iOS có thể đổi ý. */
let sabCu = -1, satCu = -1;
function doVungAnToan(){
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:0;bottom:0;width:0;height:0;visibility:hidden;' +
    'pointer-events:none;padding-top:env(safe-area-inset-top);' +
    'padding-bottom:env(safe-area-inset-bottom)';
  document.body.appendChild(d);
  const cs = getComputedStyle(d);
  const sat = Math.round(parseFloat(cs.paddingTop)  || 0);
  const sab = Math.round(parseFloat(cs.paddingBottom) || 0);
  d.remove();
  if(sat !== satCu){ document.documentElement.style.setProperty('--sat', sat + 'px'); satCu = sat; }
  if(tayChinh() !== null) return;     // người dùng đã tự chốt → không ghi đè
  if(sab !== sabCu){
    document.documentElement.style.setProperty('--sab', sab + 'px'); sabCu = sab;
    glidePrev = null; datGlide();      // bar đổi chiều cao → đặt lại viên trượt
  }
}
['DOMContentLoaded','load','pageshow','resize','orientationchange']
  .forEach(e => window.addEventListener(e, doVungAnToan));
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') setTimeout(doVungAnToan, 60);
});
// lưới an toàn: iOS có thể tính xong rất muộn, nhất là khi mở từ màn hình chính
[0, 120, 350, 800, 1600].forEach(t => setTimeout(doVungAnToan, t));

(function nguonKhoiDong(){
  const n=window.NGUON; if(!n) return;
  if(n.batTokenTuLink&&n.batTokenTuLink()) toast('Đã đăng nhập');
  S.nguon=n.cheDo;
  if(n.daDangNhap&&n.daDangNhap()) taiTuNguon();
})();
(function apNgay(){
  const v = tayChinh();
  if(v !== null){ document.documentElement.style.setProperty('--sab', v+'px'); sabCu = v; }
})();

render();
doVungAnToan();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>{glidePrev=null; datGlide();});
window.addEventListener('resize',()=>{glidePrev=null; capNhatBar();});
</script>
